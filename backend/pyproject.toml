[project]
name = "glimpse"
version = "0.1.0"
description = "Semantic image search powered by OpenRouter (vision LLM + embeddings) and Qdrant"
requires-python = ">=3.11"

dependencies = [
    # Vision + Embeddings (OpenRouter, OpenAI-compatible API)
    "openai>=3.37.0",

    # Vector DB
    "qdrant-client>=1.15.1",

    # Models
    "pydantic>=2.11.7",

    # CLI
    "typer>=0.16.0",

    # Beautiful terminal UI
    "rich>=14.1.0",

    # Env
    "python-dotenv>=1.2.2",

    # Progress bars
    "tqdm>=4.67.1",

    # Better UUIDs
    "uuid7>=0.1.0",

    # API Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
]

# `uv run start` starts the API server (backend/src/server.py).
[project.scripts]
start = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Modules live flat in src/ and use bare imports (`import config`);
# src/__init__.py puts src/ on sys.path when imported as a package.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
